name: Build TWRP Recovery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/local/graalvm \
            /usr/local/share/powershell /usr/local/share/chromium
          sudo apt-get clean
          echo "Available disk space:"
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3
          # Install repo tool
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure git
        run: |
          git config --global user.name "akhil838"
          git config --global user.email "64255484+akhil838@users.noreply.github.com"
          git config --global color.ui false

      - name: Init TWRP manifest
        run: |
          mkdir -p twrp && cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1 --depth=1
          repo sync -c --no-clone-bundle --no-tags --force-sync -j$(nproc)

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: twrp/device/lenovo/malbec

      - name: Build recovery
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_malbec-eng
          mka recoveryimage -j$(nproc) 2>&1 | tail -100

      - name: Upload recovery image
        uses: actions/upload-artifact@v4
        with:
          name: twrp-malbec-recovery
          path: |
            twrp/out/target/product/malbec/recovery.img
          if-no-files-found: error
